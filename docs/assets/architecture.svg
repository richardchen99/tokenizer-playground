<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">从学习合并规则到编码新文本</title><desc id="desc">基于 Unicode 字符的 BPE，分别呈现训练统计与编码复用。</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFAF5"/><stop offset="1" stop-color="#F2F7FA"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#586B77"/></marker>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Avenir Next",sans-serif;fill:#22313D}.display{font-family:"Songti SC","Noto Serif CJK SC",Charter,serif;font-weight:700}.small{letter-spacing:2px;font-weight:600}</style>
</defs>
<rect width="1600" height="1120" rx="24" fill="url(#paper)"/>
<text x="64" y="58" font-size="19" style="fill:#AA8244" class="small">机制图谱  /  04</text>
<text x="64" y="121" font-size="45" style="fill:#22313D" class="display">从学习合并规则到编码新文本</text>
<text x="64" y="165" font-size="23" style="fill:#586B77" class="">基于 Unicode 字符的 BPE，分别呈现训练统计与编码复用。</text>
<text x="64" y="238" font-size="19" style="fill:#AA8244" class="small">A  /  在语料上训练</text>
<text x="900" y="238" font-size="19" style="fill:#4E7E9D" class="small">B  /  对新文本编码</text>
<rect x="64" y="275" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="318" font-size="27" style="fill:#22313D" class="" font-weight="600">带词频的文本片段</text>
<text x="88" y="356" font-size="23" style="fill:#586B77" class="">按空白预分词，以 Unicode 码点作为初始符号。</text>
<path d="M 382 390 L 382 422" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="429" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="472" font-size="27" style="fill:#22313D" class="" font-weight="600">统计相邻符号对</text>
<text x="88" y="510" font-size="23" style="fill:#586B77" class="">每次出现均按所在词的语料频次加权。</text>
<path d="M 382 544 L 382 576" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="583" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="626" font-size="27" style="fill:#22313D" class="" font-weight="600">合并频次最高的符号对</text>
<text x="88" y="664" font-size="23" style="fill:#586B77" class="">从左向右替换，同一次合并不重叠。</text>
<path d="M 382 698 L 382 730" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="737" width="636" height="115" rx="18" fill="#F5F0E5" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="780" font-size="27" style="fill:#22313D" class="" font-weight="600">有序合并规则</text>
<text x="88" y="818" font-size="23" style="fill:#586B77" class="">记录当前规则，下一轮重新统计频次。</text>
<rect x="900" y="275" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="924" y="318" font-size="27" style="fill:#22313D" class="" font-weight="600">待编码的新文本</text>
<text x="924" y="356" font-size="23" style="fill:#586B77" class="">将空白作为独立片段保留。</text>
<path d="M 1218 390 L 1218 422" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="900" y="429" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="924" y="472" font-size="27" style="fill:#22313D" class="" font-weight="600">初始符号序列</text>
<text x="924" y="510" font-size="23" style="fill:#586B77" class="">Unicode 码点与内部词尾标记。</text>
<path d="M 1218 544 L 1218 576" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="900" y="583" width="636" height="115" rx="18" fill="#EDF4F8" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="924" y="626" font-size="27" style="fill:#22313D" class="" font-weight="600">应用已学规则</text>
<text x="924" y="664" font-size="23" style="fill:#586B77" class="">按训练顺序执行，无需重新学习规则。</text>
<path d="M 1218 698 L 1218 730" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="900" y="737" width="636" height="115" rx="18" fill="#FFFFFF" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="924" y="780" font-size="27" style="fill:#22313D" class="" font-weight="600">切分片段 → 原始文本</text>
<text x="924" y="818" font-size="23" style="fill:#586B77" class="">保留未见字符，检查能否无损还原。</text>
<path d="M 700 794 L 801 794 L 801 640 L 893 640" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="796" y="602" font-size="20" style="fill:#4E7E9D" class="" text-anchor="middle">复用</text>
<path d="M 700 630 L 758 630 L 758 486 L 703 486" fill="none" stroke="#586B77" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="790" y="475" font-size="19" style="fill:#AA8244" class="" text-anchor="middle">迭代</text>
<rect x="64" y="919" width="1472" height="103" rx="18" fill="#EDF5F0" stroke="#CBD6DB" stroke-width="1.5"/>
<text x="88" y="962" font-size="25" style="fill:#22313D" class="" font-weight="600">频次统计与实际替换遵循不同规则</text>
<text x="88" y="1000" font-size="23" style="fill:#586B77" class="">重叠位置均参与计数；同一次合并中，每个符号最多参与一次替换。</text>
<path d="M 64 1048 L 1536 1048" stroke="#CBD6DB" stroke-width="1.5" fill="none"/>
<text x="64" y="1083" font-size="18" style="fill:#586B77" class="">教学 BPE 使用码点与空白边界，输出词元数不用于生产模型计费。</text>
<text x="1536" y="1083" font-size="18" style="fill:#586B77" class="" text-anchor="end">Richard Chen  ·  AI 交互实验室</text>
</svg>
